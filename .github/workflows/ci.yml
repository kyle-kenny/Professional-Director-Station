name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run audit:static
      - run: npm run audit:windows
      - run: npm run audit:collab
      - run: npm run audit:pipeline
      - run: npm run audit:ai
      - run: npm test
      - run: npm run build
